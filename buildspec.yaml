version: 0.2

phases:

  pre_build:
    commands:
      # Authenticate Docker with Amazon ECR so we can push our container image later
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 031621556164.dkr.ecr.us-east-2.amazonaws.com

  build:
    commands:
      # ==========================================
      # ZIP-BASED LAMBDAS & LAYERS (Traditional)
      # ==========================================
      - echo "Creating directory structure for lambda layer..."
      - mkdir -p build/dependencies/python/lib/python3.14/site-packages
      - mkdir -p build/api_router_lambda

      - echo "Installing dependencies from requirements.txt for the zip layer..."
      - pip install -r <(grep -vE "pytest|google|firecrawl" requirements.txt) -t build/dependencies/python/lib/python3.14/site-packages/ --root-user-action=ignore

      - echo "Copying agro lib folder into site-packages..."
      # "Inside site-packages it should have all the packages in requirements.txt and the agro lib folder"
      - cp -r lib build/dependencies/python/lib/python3.14/site-packages/

      - echo "Creating zip file for the lambda layer..."
      - cd build/dependencies && zip -r ../agro-core-layer.zip python && cd ../..

      - echo "Creating zip file for the api router lambda function code..."
      - cp lib/lambdas/agro_api_router.py build/api_router_lambda/
      - cp -r config build/api_router_lambda/
      - cd build/api_router_lambda && zip -r ../api_router_function.zip . && cd ../..

      # ==========================================
      # CONTAINER-BASED LAMBDAS (Playwright)
      # ==========================================
      - echo "Building Docker image for ScrapeEventListPlaywright..."
      # Build the Docker image from the project root, using the Dockerfile located in the docker/ directory
      - docker buildx build --platform linux/amd64 --provenance=false -f docker/Dockerfile -t scrape-event-list .
      # Tag the built image with our specific ECR repository URI
      - docker tag scrape-event-list:latest 031621556164.dkr.ecr.us-east-2.amazonaws.com/agro/scrape-event-list:latest

  post_build:
    commands:
      # ==========================================
      # DEPLOY ZIP-BASED LAMBDAS & LAYERS
      # ==========================================
      - echo "Uploading layer zip to S3 bucket..."
      - aws s3 cp build/agro-core-layer.zip s3://agro-dev-ops-031621556164-us-east-2-an/agro-core-layer.zip --region us-east-2

      - echo "Publishing new Lambda layer version..."
      - "LAYER_VERSION_ARN=$(aws lambda publish-layer-version --layer-name agroCore --content S3Bucket=agro-dev-ops-031621556164-us-east-2-an,S3Key=agro-core-layer.zip --compatible-runtimes python3.14 --region us-east-2 --query LayerVersionArn --output text)"
      - "echo New layer version published: $LAYER_VERSION_ARN"

      - echo "Updating Lambda function code for zip-based functions..."
      - aws lambda update-function-code --function-name AgroApiRouter --zip-file fileb://build/api_router_function.zip --region us-east-2

      - echo "Wait for zip-based Lambda function code to update..."
      - aws lambda wait function-updated --function-name AgroApiRouter --region us-east-2

      - echo "Updating Lambda function to use the new layer version..."
      - "aws lambda update-function-configuration --function-name AgroApiRouter --layers $LAYER_VERSION_ARN --region us-east-2"

      # ==========================================
      # DEPLOY CONTAINER-BASED LAMBDAS
      # ==========================================
      - echo "Pushing the Docker image to ECR..."
      - docker push 031621556164.dkr.ecr.us-east-2.amazonaws.com/agro/scrape-event-list:latest

      - echo "Updating ScrapeEventListPlaywright Lambda function to use the new Docker image..."
      - aws lambda update-function-code --function-name ScrapeEventListPlaywright --image-uri 031621556164.dkr.ecr.us-east-2.amazonaws.com/agro/scrape-event-list:latest --region us-east-2

      - echo "Wait for ScrapeEventListPlaywright Lambda function code to update..."
      - aws lambda wait function-updated --function-name ScrapeEventListPlaywright --region us-east-2
