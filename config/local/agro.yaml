scraper:
  default: agro
fetcher:
  default: drission_page
  drission_page:
    max_screenshot_height: 16000
data_extractor:
  default: openai
image_saver:
  default: s3
  s3:
    bucket: "agro-images"
    region: "us-east-1"
    path_prefix: "event-images"
    aws_access_key_id_env: "AWS_ACCESS_KEY_ID"
    aws_secret_access_key_env: "AWS_SECRET_ACCESS_KEY"
  local:
    images_dir: "./images"
